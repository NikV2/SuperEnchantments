name: SuperEnchantments
version: ${project.version}
main: me.nik.superenchantments.SuperEnchantments
api-version: '1.17'
prefix: SuperEnchantments
authors: [ Nik ]
description: ${project.description}
commands:
  superenchantments:
    description: The main superenchantments command.
    aliases: [ se, senchants, enchants, ce ]
permissions:
  superenchantments.admin:
    description: Use the /superenchantments command.
    default: op
  superenchantments.menu:
    description: Open the enchantments menu.
    default: true
  superenchantments.enchanter:
    description: Open the enchanter menu.
    default: true
  superenchantments.disenchant:
    description: Open the menu to remove custom enchants.
    default: true
